# Local development services for Ellmud.
# Usage: docker compose up -d
#
# Redis 7 — narration cache + Colyseus presence (Phase 2).
# PostgreSQL 16 — player persistence (future; stubbed for local dev).

name: ellmud

services:
  redis:
    image: redis:8-alpine
    container_name: ellmud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: ellmud-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ellmud
      POSTGRES_PASSWORD: ellmud_dev
      POSTGRES_DB: ellmud
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellmud"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Ellmud game server (optional, for local testing with containers)
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ellmud-server
    ports:
      - "2567:2567"
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 2567
      DATABASE_URL: postgresql://ellmud:ellmud_dev@postgres:5432/ellmud
      REDIS_CONNECTION_STRING: redis://redis:6379
      REDIS_CACHE_ENABLED: "true"
      REDIS_PRESENCE_ENABLED: "true"
      REDIS_DRIVER_ENABLED: "true"
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_TENANT_SUBDOMAIN: ${ENTRA_TENANT_SUBDOMAIN}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI}
      ALLOW_LOCAL_AUTH: ${ALLOW_LOCAL_AUTH:-true}
      DEV_MODE_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full

volumes:
  redis-data:
  postgres-data:
