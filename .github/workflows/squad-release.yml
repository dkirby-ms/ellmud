name: Squad Release

on:
  push:
    branches: [prod, dev]
    paths-ignore:
      - docs/**
      - .squad/**
      - .github/**
      - .copilot/**
      - infra/**
      - "*.md"
      - "**/*.md"
      - LICENSE
      - .gitattributes
      - .gitignore

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Verify release
        run: |
          if [ -f .semantic-release-version ]; then
            VERSION=$(cat .semantic-release-version)
            echo "✅ Released version $VERSION"
          else
            echo "ℹ️ No new release created (no releasable commits since last release)"
          fi
