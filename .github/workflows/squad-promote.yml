name: Squad Promote (uat → prod)

# Promotes uat → prod via pull request (respects branch protection).
# For dev → uat promotion, use scheduled-uat-promote.yml (runs automatically
# on schedule, or trigger manually via workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would happen without pushing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: prod-promote
  cancel-in-progress: false

jobs:
  uat-to-prod:
    name: Promote uat → prod (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state
        run: |
          echo "=== uat HEAD ===" && git log origin/uat -1 --oneline
          echo "=== prod HEAD ===" && git log origin/prod -1 --oneline

      - name: Validate uat is release-ready
        run: |
          git checkout uat

          # Verify no forbidden files on uat
          FORBIDDEN=$(git ls-files | grep -E "^(\.(ai-team|squad|ai-team-templates)/|team-docs/|docs/proposals/)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files found on uat: $FORBIDDEN"
            exit 1
          fi
          echo "✅ No forbidden files on uat"

      - name: Check if promotion needed
        id: check
        run: |
          if [ "$(git rev-parse origin/uat)" = "$(git rev-parse origin/prod)" ]; then
            echo "ℹ️ prod already matches uat — nothing to promote"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(git rev-list --count origin/prod..origin/uat)
            echo "📦 uat is $COMMIT_COUNT commit(s) ahead of prod"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run — show what would be promoted
        if: ${{ inputs.dry_run == 'true' && steps.check.outputs.skip != 'true' }}
        run: |
          echo "🔍 DRY RUN — the following commits would be promoted to prod:"
          echo ""
          git log --oneline origin/prod..origin/uat
          echo ""
          echo "Files that would change:"
          git diff --stat origin/prod..origin/uat
          echo ""
          echo "🔍 Dry run complete — no PR created."

      - name: Create promotion branch and open PR
        if: ${{ inputs.dry_run == 'false' && steps.check.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="promote/uat-to-prod-${TIMESTAMP}"

          # Create temp branch from uat content
          git checkout -b "$BRANCH" origin/uat

          # Strip forbidden paths (single source of truth)
          bash .github/scripts/strip-forbidden-paths.sh

          # Commit stripped paths if any were removed
          if ! git diff --cached --quiet; then
            git commit -m "chore: strip forbidden paths for prod promotion"
          fi

          # Push the promotion branch
          git push origin "$BRANCH"

          # Build PR body with commit summary
          COMMIT_LOG=$(git log --oneline origin/prod..origin/uat | head -50)
          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"
          PR_BODY="## Promoting uat → prod

          **Commits being promoted:** ${COMMIT_COUNT}

          ### Commit log
          \`\`\`
          ${COMMIT_LOG}
          \`\`\`

          ---
          *Automated by squad-promote workflow.*"

          # Create PR targeting prod
          PR_URL=$(gh pr create \
            --base prod \
            --head "$BRANCH" \
            --title "chore: promote uat → prod" \
            --body "$PR_BODY")

          echo "✅ PR created: $PR_URL"

          # Auto-merge the PR (will merge once required checks pass)
          gh pr merge "$PR_URL" --auto --merge --delete-branch

          echo "✅ Auto-merge enabled — PR will merge when checks pass"

      # CI/CD is triggered automatically by the push/merge to prod (ci-cd.yml on: push).
      # No manual dispatch needed — that caused duplicate CI/CD runs.

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' && steps.check.outputs.skip == 'true' }}
        run: echo "🔍 Dry run complete — prod already matches uat, nothing to do."
