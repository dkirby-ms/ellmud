name: Squad Promote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would happen without pushing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  actions: write

concurrency:
  group: uat-promote
  cancel-in-progress: false

jobs:
  dev-to-uat:
    name: Promote dev → uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show current state (dry run info)
        run: |
          echo "=== dev HEAD ===" && git log origin/dev -1 --oneline
          echo "=== uat HEAD ===" && git log origin/uat -1 --oneline
          echo "=== Current version ===" && node -e "console.log(require('./package.json').version)"
          echo "=== Files that would be stripped ==="
          git diff origin/uat..origin/dev --name-only | grep -E "^(\.(ai-team|squad|ai-team-templates)|team-docs/|docs/proposals/)" || echo "(none)"
          
          # Show what version would be bumped to
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            CURRENT=$(node -e "console.log(require('./package.json').version)")
            PARTS=(${CURRENT//./ })
            MAJOR=${PARTS[0]}
            MINOR=${PARTS[1]}
            PATCH=${PARTS[2]}
            NEW_PATCH=$((PATCH + 1))
            echo "=== Would bump version to: ${MAJOR}.${MINOR}.${NEW_PATCH} ==="
          fi

      - name: Merge dev → uat (strip forbidden paths)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git checkout uat
          git merge origin/dev --no-commit --no-ff -X theirs || true

          # Strip forbidden paths from merge commit
          bash .github/scripts/strip-forbidden-paths.sh

          # Commit the merge if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: merge dev → uat"
            echo "✅ Merged dev into uat"
          else
            echo "ℹ️ Nothing to merge — uat is already up to date"
          fi

      - name: Bump patch version
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          # Bump patch version
          npm version patch --no-git-tag-version
          
          # Sync workspace versions
          npm run version:sync
          
          # Get the new version
          NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "📦 Bumped version to $NEW_VERSION"
          
          # Commit version bump
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          
          # Push both commits (merge + version bump)
          git push origin uat
          echo "✅ Pushed uat branch with version $NEW_VERSION"

      - name: Trigger CI/CD on uat
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Give GitHub a moment to process the push
          sleep 5
          gh workflow run ci-cd.yml --ref uat
          echo "✅ Triggered CI/CD pipeline on uat"

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."

  uat-to-prod:
    name: Promote uat → prod (release)
    needs: dev-to-uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show current state
        run: |
          echo "=== uat HEAD ===" && git log origin/uat -1 --oneline
          echo "=== prod HEAD ===" && git log origin/prod -1 --oneline
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          echo "=== Current version: $CURRENT ==="
          
          # Show what version would be bumped to
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            PARTS=(${CURRENT//./ })
            MAJOR=${PARTS[0]}
            MINOR=${PARTS[1]}
            NEW_MINOR=$((MINOR + 1))
            echo "=== Would bump minor version to: ${MAJOR}.${NEW_MINOR}.0 ==="
          fi

      - name: Validate uat is release-ready
        run: |
          git checkout uat
          
          # Verify no forbidden files on uat
          FORBIDDEN=$(git ls-files | grep -E "^(\.(ai-team|squad|ai-team-templates)/|team-docs/|docs/proposals/)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files found on uat: $FORBIDDEN"
            exit 1
          fi
          echo "✅ No forbidden files on uat"

      - name: Merge uat → prod
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git checkout prod
          git merge origin/uat --no-ff -m "chore: merge uat → prod"
          echo "✅ Merged uat into prod"

      - name: Bump minor version
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          # Bump minor version (resets patch to 0)
          npm version minor --no-git-tag-version
          
          # Sync workspace versions
          npm run version:sync
          
          # Get the new version
          NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "📦 Bumped minor version to $NEW_VERSION"
          
          # Commit version bump
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          
          # Push both commits (merge + version bump)
          git push origin prod
          echo "✅ Pushed prod — squad-release.yml will tag and publish release v$NEW_VERSION"

      - name: Trigger CI/CD on prod
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh workflow run ci-cd.yml --ref prod
          echo "✅ Triggered CI/CD pipeline on prod"

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."
