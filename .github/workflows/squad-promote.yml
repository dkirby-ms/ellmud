name: Squad Promote (uat → prod)

# Promotes uat → prod and triggers a release.
# For dev → uat promotion, use scheduled-uat-promote.yml (runs automatically
# on schedule, or trigger manually via workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would happen without pushing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  actions: write

concurrency:
  group: prod-promote
  cancel-in-progress: false

jobs:
  uat-to-prod:
    name: Promote uat → prod (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show current state
        run: |
          echo "=== uat HEAD ===" && git log origin/uat -1 --oneline
          echo "=== prod HEAD ===" && git log origin/prod -1 --oneline

      - name: Validate uat is release-ready
        run: |
          git checkout uat
          
          # Verify no forbidden files on uat
          FORBIDDEN=$(git ls-files | grep -E "^(\.(ai-team|squad|ai-team-templates)/|team-docs/|docs/proposals/)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files found on uat: $FORBIDDEN"
            exit 1
          fi
          echo "✅ No forbidden files on uat"

      - name: Merge uat → prod
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          git checkout prod
          git merge origin/uat --no-ff -m "chore: merge uat → prod"
          git push origin prod
          echo "✅ Merged uat into prod and pushed — squad-release.yml will create release"

      - name: Trigger CI/CD on prod
        if: ${{ inputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh workflow run ci-cd.yml --ref prod
          echo "✅ Triggered CI/CD pipeline on prod"

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no changes pushed."
