name: Scheduled UAT Promote

# Automatically promotes dev → uat on a schedule.
# For full dev → uat → prod promotion, use squad-promote.yml (manual).

on:
  schedule:
    # 3x daily: 08:00 UTC (morning), 14:00 UTC (midday), 20:00 UTC (evening)
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
    - cron: "0 01 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: uat-promote
  cancel-in-progress: false

jobs:
  promote-dev-to-uat:
    name: Promote dev → uat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if dev is ahead of uat
        id: check
        run: |
          AHEAD=$(git rev-list --count origin/uat..origin/dev)
          echo "commits_ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "ℹ️ dev is not ahead of uat — nothing to promote"
          else
            echo "📦 dev is $AHEAD commit(s) ahead of uat"
          fi

      - name: Show current state
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          echo "=== dev HEAD ===" && git log origin/dev -1 --oneline
          echo "=== uat HEAD ===" && git log origin/uat -1 --oneline
          echo "=== Files that would be stripped ==="
          git diff origin/uat..origin/dev --name-only | grep -E "^(\.(ai-team|squad|ai-team-templates)|team-docs/|docs/proposals/)" || echo "(none)"

      - name: Merge dev → uat (strip forbidden paths)
        id: merge
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          git checkout uat

          # Merge dev into uat; allow "already up to date" but fail on real errors
          MERGE_EXIT=0
          git merge origin/dev --no-commit --no-ff -X theirs || MERGE_EXIT=$?
          if [ "$MERGE_EXIT" -ne 0 ]; then
            # Exit code 128 = nothing to merge / already up to date with --no-commit
            if git diff --cached --quiet && git diff --quiet; then
              echo "ℹ️ Nothing to merge — trees are identical"
            else
              # Check if all unmerged (conflicted) files are in forbidden paths
              FORBIDDEN_RE="^(\\.ai-team/|\\.squad/|\\.ai-team-templates/|team-docs/|docs/proposals/)"
              UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              NON_FORBIDDEN=$(echo "$UNMERGED" | grep -vE "$FORBIDDEN_RE" || true)
              if [ -z "$NON_FORBIDDEN" ] && [ -n "$UNMERGED" ]; then
                echo "⚠️ Conflicts only in forbidden paths — resolving by removal"
                echo "$UNMERGED" | xargs -r git rm -f --cached 2>/dev/null || true
                echo "$UNMERGED" | xargs -r rm -f 2>/dev/null || true
              else
                echo "::error::Merge failed with exit code $MERGE_EXIT"
                git merge --abort 2>/dev/null || true
                exit 1
              fi
            fi
          fi

          # Strip forbidden paths from merge commit
          bash .github/scripts/strip-forbidden-paths.sh

          # Commit the merge if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: merge dev → uat [scheduled]"
            git push origin uat
            echo "✅ Merged dev into uat and pushed"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Nothing to deploy — all changes were in stripped paths"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # CI/CD is triggered automatically by the push to uat (ci-cd.yml on: push).
      # No manual dispatch needed — that caused duplicate CI/CD runs and repeated
      # Discord notifications.
