name: Scheduled UAT Promote

# Automatically promotes dev → uat on a schedule.
# For full dev → uat → prod promotion, use squad-promote.yml (manual).

on:
  schedule:
    # 3x daily: 08:00 UTC (morning), 14:00 UTC (midday), 20:00 UTC (evening)
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
    - cron: "0 01 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: uat-promote
  cancel-in-progress: false

jobs:
  promote-dev-to-uat:
    name: Promote dev → uat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if dev is ahead of uat
        id: check
        run: |
          AHEAD=$(git rev-list --count origin/uat..origin/dev)
          echo "commits_ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -eq 0 ]; then
            echo "ℹ️ dev is not ahead of uat — nothing to promote"
          else
            echo "📦 dev is $AHEAD commit(s) ahead of uat"
          fi

      - name: Show current state
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          echo "=== dev HEAD ===" && git log origin/dev -1 --oneline
          echo "=== uat HEAD ===" && git log origin/uat -1 --oneline
          echo "=== Files that would be stripped ==="
          git diff origin/uat..origin/dev --name-only | grep -E "^(\.(ai-team|squad|ai-team-templates)|team-docs/|docs/proposals/)" || echo "(none)"

      - name: Merge dev → uat (strip forbidden paths)
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          git checkout uat
          git merge origin/dev --no-commit --no-ff -X theirs || true

          # Strip forbidden paths from merge commit
          bash .github/scripts/strip-forbidden-paths.sh

          # Commit the merge if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: merge dev → uat [scheduled]"
            echo "✅ Merged dev into uat"
          else
            echo "ℹ️ Nothing to merge — uat is already up to date after stripping"
          fi

      - name: Bump patch version
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          # Bump patch version
          npm version patch --no-git-tag-version
          
          # Sync workspace versions
          npm run version:sync
          
          # Get the new version
          NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "📦 Bumped version to $NEW_VERSION"
          
          # Commit version bump
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          
          # Push both commits (merge + version bump)
          git push origin uat
          echo "✅ Pushed uat branch with version $NEW_VERSION"

      - name: Trigger CI/CD on uat
        if: steps.check.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Give GitHub a moment to process the push
          sleep 5
          gh workflow run ci-cd.yml --ref uat
          echo "✅ Triggered CI/CD pipeline on uat"
