name: CI/CD

# ─── Branch Strategy ─────────────────────────────────────────────────────────
# dev  — active development, PRs merge here, tests only (no deploy)
# uat  — staging/QA, push triggers build + deploy to UAT Container App
# prod — production, push triggers build + deploy to Prod Container App

on:
  pull_request:
    branches: [uat, prod]
    paths-ignore:
      - docs/**
      - .squad/**
      - "*.md"
      - "**/*.md"
  push:
    branches: [uat, prod]
    paths-ignore:
      - docs/**
      - .squad/**
      - "*.md"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build, Test, Lint ────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (high + critical)
        run: npm audit --audit-level=high

      - name: Build workspaces
        run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit -p packages/server/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

  # ─── Docker Build & Push to ACR ───────────────────────────────────────────────
  # Runs on push to uat/prod only. Uses GitHub environments for per-env secrets.
  docker-build-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login via OIDC
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ellmud-${{ github.ref_name }}:${{ github.sha }} \
            --image ellmud-${{ github.ref_name }}:latest \
            --file Dockerfile \
            .

  # ─── Deploy to Azure Container Apps ───────────────────────────────────────────
  # Environment-aware: secrets (CONTAINER_APP_NAME, RESOURCE_GROUP) come from
  # the GitHub environment matching the branch name (uat or prod).
  deploy:
    if: github.event_name == 'push'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login via OIDC
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a # v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current revision (for rollback)
        id: pre-deploy
        run: |
          CURRENT_REVISION=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "[?properties.active].name | [0]" -o tsv)
          echo "revision=$CURRENT_REVISION" >> "$GITHUB_OUTPUT"
          echo "Current active revision: $CURRENT_REVISION"

      - name: Configure container app registry
        run: |
          az containerapp registry set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --server ${{ secrets.ACR_NAME }}.azurecr.io \
            --identity system

      - name: Deploy to Container App
        run: |
          # Setting --command fully replaces the Bicep bootstrap entrypoint.
          # The command array ["node", "packages/server/dist/index.js"] specifies
          # the complete execution, no args needed.
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/ellmud-${{ github.ref_name }}:${{ github.sha }} \
            --set-env-vars \
              "NODE_ENV=production" \
              "PORT=2567" \
              "ENTRA_CLIENT_ID=${{ secrets.ENTRA_CLIENT_ID }}" \
              "ENTRA_CLIENT_SECRET=${{ secrets.ENTRA_CLIENT_SECRET }}" \
              "ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }}" \
              "ENTRA_REDIRECT_URI=${{ secrets.ENTRA_REDIRECT_URI }}" \
              "ALLOW_LOCAL_AUTH=false" \
              "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
              "REDIS_PRESENCE_ENABLED=true" \
              "REDIS_CACHE_ENABLED=true" \
              "REDIS_DRIVER_ENABLED=true" \
            --container-name ellmud \
            --command "node" "packages/server/dist/index.js"

      - name: Update ingress target port
        run: |
          az containerapp ingress update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --target-port 2567

      - name: Monitor revision deployment
        run: |
          APP="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.RESOURCE_GROUP }}"
          
          # Get the latest revision created by the update
          LATEST_REV=$(az containerapp revision list \
            --name "$APP" \
            --resource-group "$RG" \
            --query "sort_by(@, &properties.createdTime)[-1].name" -o tsv)
          
          echo "Monitoring revision: $LATEST_REV"
          
          # Poll until revision reaches a terminal state
          for i in $(seq 1 30); do
            STATUS=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$LATEST_REV" \
              --query "properties.runningState" -o tsv)
            
            case "$STATUS" in
              Running|RunningAtMaxScale)
                echo "✓ Revision $LATEST_REV is running (state: $STATUS)"
                break
                ;;
              Failed|Degraded)
                echo "✗ Revision $LATEST_REV failed with status: $STATUS"
                # Show provisioning errors if available
                az containerapp revision show \
                  --name "$APP" \
                  --resource-group "$RG" \
                  --revision "$LATEST_REV" \
                  --query "properties.template.containers[0]" \
                  -o json || true
                exit 1
                ;;
              *)
                echo "Revision status: $STATUS (attempt $i/30)"
                sleep 10
                ;;
            esac
          done
          
          if [ "$STATUS" != "Running" ] && [ "$STATUS" != "RunningAtMaxScale" ]; then
            echo "✗ Revision did not reach Running state after 5 minutes"
            exit 1
          fi

      - name: Health check
        id: healthcheck
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          HEALTH_URL="https://${FQDN}/health"
          echo "Checking health endpoint: $HEALTH_URL"

          MAX_ATTEMPTS=20
          ATTEMPT=0
          RESPONSE=""

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RESPONSE=$(curl -f -s "$HEALTH_URL" 2>/dev/null || true)
            # Real server returns "uptime" field; placeholder returns "mode":"placeholder"
            if echo "$RESPONSE" | grep -q '"uptime"'; then
              echo "✓ Health check passed (real server confirmed)"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ -z "$RESPONSE" ]; then
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS — no response (server starting?), retrying in 5s..."
            elif echo "$RESPONSE" | grep -q '"mode":"placeholder"'; then
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS — placeholder still active, retrying in 5s..."
            else
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS — unexpected response, retrying in 5s..."
            fi
            sleep 5
          done

          echo "✗ Health check failed after $MAX_ATTEMPTS attempts"
          echo "Last response: $RESPONSE"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.pre-deploy.outputs.revision != ''
        run: |
          echo "Rolling back to revision: ${{ steps.pre-deploy.outputs.revision }}"
          FAILED_REVISION=$(az containerapp revision list \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "[?properties.active].name | [0]" -o tsv)

          # Log failed revision details for debugging
          if [ -n "$FAILED_REVISION" ]; then
            echo "Failed revision: $FAILED_REVISION"
            FAILED_STATUS=$(az containerapp revision show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --revision "$FAILED_REVISION" \
              --query "properties.runningState" -o tsv || echo "unknown")
            echo "Failed revision status: $FAILED_STATUS"
            
            # Try to get provisioning errors
            echo "Container details:"
            az containerapp revision show \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --revision "$FAILED_REVISION" \
              --query "{command: properties.template.containers[0].command, args: properties.template.containers[0].args, image: properties.template.containers[0].image}" \
              -o json || true
          fi

          az containerapp revision set-mode \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --mode multiple

          az containerapp ingress traffic set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --revision-weight "${{ steps.pre-deploy.outputs.revision }}=100"

          if [ -n "$FAILED_REVISION" ] && [ "$FAILED_REVISION" != "${{ steps.pre-deploy.outputs.revision }}" ]; then
            az containerapp revision deactivate \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --revision "$FAILED_REVISION"
          fi

          az containerapp revision set-mode \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --mode single

          echo "✓ Rollback complete"

  # ─── Create issue on CI failure ───────────────────────────────────────────────
  create-failure-issue:
    if: failure() && github.event_name == 'push'
    needs: [build-and-test, docker-build-push, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="CI/CD failure on ${BRANCH} (${SHORT_SHA})"

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_issue" ]; then
            echo "Issue #$existing_issue already exists for ${SHORT_SHA}."
            exit 0
          fi

          body_file="$(mktemp)"
          cat <<EOF > "$body_file"
          CI/CD failure detected on \`${BRANCH}\`.

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Commit message: ${COMMIT_MESSAGE}
          - Commit author: ${COMMIT_AUTHOR}
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --label bug \
            --body-file "$body_file"
