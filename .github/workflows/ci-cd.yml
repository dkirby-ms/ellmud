name: CI/CD

# ─── Branch Strategy ─────────────────────────────────────────────────────────
# dev  — active development, PRs merge here, tests only (no deploy)
# uat  — staging/QA, push triggers build + deploy to UAT Container App
# prod — production, push triggers build + deploy to Prod Container App

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to build/test/deploy
        required: false
        type: string
  pull_request:
    branches: [uat, prod]
    paths-ignore:
      - docs/**
      - .squad/**
      - .github/**
      - .copilot/**
      - infra/**
      - "*.md"
      - "**/*.md"
      - LICENSE
      - .gitattributes
      - .gitignore
  push:
    branches: [uat, prod]
    paths-ignore:
      - docs/**
      - .squad/**
      - .github/**
      - .copilot/**
      - infra/**
      - "*.md"
      - "**/*.md"
      - LICENSE
      - .gitattributes
      - .gitignore

permissions:
  contents: read

env:
  BUILD_SHA: ${{ github.event.inputs.sha || github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build, Test, Lint ────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit (informational)
        run: npm audit --audit-level=high || true

      - name: Production dependency audit (high + critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Build workspaces
        run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit -p packages/server/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

  # ─── Docker Build & Push to ACR ───────────────────────────────────────────────
  # Runs on push to uat/prod only. Uses GitHub environments for per-env secrets.
  docker-build-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ellmud-${{ github.ref_name }}:${{ env.BUILD_SHA }} \
            --image ellmud-${{ github.ref_name }}:latest \
            --file Dockerfile \
            .

  # ─── Deploy to Azure Container Apps ───────────────────────────────────────────
  # Environment-aware: secrets (CONTAINER_APP_NAME, RESOURCE_GROUP) come from
  # the GitHub environment matching the branch name (uat or prod).
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current revision (for rollback)
        id: pre-deploy
        run: |
          set -euo pipefail

          APP="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.RESOURCE_GROUP }}"

          az_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            while true; do
              if "$@"; then
                return 0
              fi
              local rc=$?

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::warning::az command failed after $attempt attempts: $*" >&2
                return "$rc"
              fi

              echo "az command failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if [ "$delay" -gt 30 ]; then
                delay=30
              fi
            done
          }

          CURRENT_REVISION=$(az_retry 5 az containerapp revision list \
            --name "$APP" \
            --resource-group "$RG" \
            --query "[?properties.active].name | [0]" -o tsv)
          CURRENT_IMAGE=$(az_retry 5 az containerapp revision list \
            --name "$APP" \
            --resource-group "$RG" \
            --query "[?properties.active].properties.template.containers[0].image | [0]" -o tsv)
          REVISION_MODE=$(az_retry 5 az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.configuration.activeRevisionsMode" -o tsv)

          echo "revision=$CURRENT_REVISION" >> "$GITHUB_OUTPUT"
          echo "image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"
          echo "mode=$REVISION_MODE" >> "$GITHUB_OUTPUT"
          echo "Current active revision: $CURRENT_REVISION"
          echo "Current active image: $CURRENT_IMAGE"
          echo "Current revision mode: $REVISION_MODE"

      - name: Configure container app registry
        run: |
          az containerapp registry set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --server ${{ secrets.ACR_NAME }}.azurecr.io \
            --identity system

      - name: Deploy to Container App
        run: |
          # Setting --command fully replaces the Bicep bootstrap entrypoint.
          # The command array ["node", "packages/server/dist/index.js"] specifies
          # the complete execution, no args needed.
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/ellmud-${{ github.ref_name }}:${{ env.BUILD_SHA }} \
            --set-env-vars \
              "NODE_ENV=production" \
              "PORT=2567" \
              "ENTRA_CLIENT_ID=${{ secrets.ENTRA_CLIENT_ID }}" \
              "ENTRA_CLIENT_SECRET=${{ secrets.ENTRA_CLIENT_SECRET }}" \
              "ENTRA_TENANT_ID=${{ secrets.ENTRA_TENANT_ID }}" \
              "ENTRA_TENANT_SUBDOMAIN=${{ secrets.ENTRA_TENANT_SUBDOMAIN }}" \
              "ENTRA_REDIRECT_URI=${{ secrets.ENTRA_REDIRECT_URI }}" \
              "CLIENT_URL=${{ secrets.CLIENT_URL }}" \
              "ALLOW_LOCAL_AUTH=true" \
              "AUTH_REQUIRED=true" \
              "ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}" \
              "DEV_MODE_ENABLED=false" \
              "REDIS_PRESENCE_ENABLED=false" \
              "REDIS_CACHE_ENABLED=false" \
              "REDIS_DRIVER_ENABLED=false" \
              "OPENAI_LLM_ENDPOINT=${{ secrets.OPENAI_LLM_ENDPOINT }}" \
              "OPENAI_LLM_KEY=${{ secrets.OPENAI_LLM_KEY }}" \
              "OPENAI_LLM_MODEL=${{ secrets.OPENAI_LLM_MODEL }}" \
              "ENABLE_LLM_NARRATION=true" \
            --container-name ellmud \
            --command "node" "packages/server/dist/index.js"

      - name: Update ingress target port
        run: |
          az containerapp ingress update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --target-port 2567

      - name: Monitor revision deployment
        run: |
          set -euo pipefail

          APP="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.RESOURCE_GROUP }}"

          az_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            while true; do
              if "$@"; then
                return 0
              fi
              local rc=$?

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::warning::az command failed after $attempt attempts: $*" >&2
                return "$rc"
              fi

              echo "az command failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if [ "$delay" -gt 30 ]; then
                delay=30
              fi
            done
          }

          revision_field() {
            python3 -c 'import json, sys; data=json.load(sys.stdin) or {}; print(((data.get("properties") or {}).get(sys.argv[1])) or "")' "$1"
          }

          # Get the latest revision created by the update.
          LATEST_REV=$(az_retry 5 az containerapp revision list \
            --name "$APP" \
            --resource-group "$RG" \
            --query "sort_by(@, &properties.createdTime)[-1].name" -o tsv)

          echo "Monitoring revision: $LATEST_REV"

          STATUS=""
          HEALTH=""

          # Poll until the revision is Running and Healthy, tolerating transient az/network failures.
          for i in $(seq 1 72); do
            if ! REVISION_JSON=$(az_retry 3 az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$LATEST_REV" \
              -o json); then
              echo "Revision status unavailable due to transient az error (attempt $i/72); retrying in 10s..."
              sleep 10
              continue
            fi

            STATUS=$(printf '%s' "$REVISION_JSON" | revision_field runningState)
            HEALTH=$(printf '%s' "$REVISION_JSON" | revision_field healthState)

            case "$STATUS" in
              Running|RunningAtMaxScale)
                if [ "$HEALTH" = "Healthy" ] || [ -z "$HEALTH" ]; then
                  echo "✓ Revision $LATEST_REV is running and healthy (state: $STATUS, health: ${HEALTH:-unknown})"
                  exit 0
                fi
                ;;
              Failed|Degraded)
                echo "✗ Revision $LATEST_REV failed with status: $STATUS, health: ${HEALTH:-unknown}"
                echo "Container details:"
                az_retry 3 az containerapp revision show \
                  --name "$APP" \
                  --resource-group "$RG" \
                  --revision "$LATEST_REV" \
                  --query "properties.template.containers[0]" \
                  -o json || true
                exit 1
                ;;
            esac

            case "$HEALTH" in
              Unhealthy|Degraded)
                echo "Revision $LATEST_REV is not healthy yet (state: ${STATUS:-unknown}, health: $HEALTH; attempt $i/72)"
                ;;
            esac

            echo "Revision status: ${STATUS:-unknown}, health: ${HEALTH:-unknown} (attempt $i/72)"
            sleep 10
          done

          echo "✗ Revision did not reach Running/Healthy state after 12 minutes"
          echo "Last observed status: ${STATUS:-unknown}, health: ${HEALTH:-unknown}"
          exit 1

      - name: Health check
        id: healthcheck
        run: |
          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          HEALTH_URL="https://${FQDN}/health"
          echo "Checking health endpoint: $HEALTH_URL"

          MAX_ATTEMPTS=20
          ATTEMPT=0
          RESPONSE=""
          HTTP_CODE=""

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o response.tmp -w '%{http_code}' "$HEALTH_URL" || echo "000")
            RESPONSE=$(cat response.tmp 2>/dev/null || true)
            rm -f response.tmp

            # Accept if: HTTP 200 + JSON contains status "ok" and no placeholder marker
            if [ "$HTTP_CODE" = "200" ] \
              && echo "$RESPONSE" | grep -q '"status"' \
              && echo "$RESPONSE" | grep -q '"ok"' \
              && ! echo "$RESPONSE" | grep -q '"placeholder"'; then
              echo "✓ Health check passed — HTTP $HTTP_CODE, status: ok"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            if [ -z "$RESPONSE" ]; then
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS — no response (server starting?), retrying in 5s..."
            elif echo "$RESPONSE" | grep -q '"placeholder"'; then
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS — placeholder still active, retrying in 5s..."
            else
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $HTTP_CODE, retrying in 5s..."
            fi
            sleep 5
          done

          echo "✗ Health check failed after $MAX_ATTEMPTS attempts"
          echo "Last response (HTTP $HTTP_CODE): $RESPONSE"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.pre-deploy.outputs.revision != ''
        run: |
          set -euo pipefail

          APP="${{ secrets.CONTAINER_APP_NAME }}"
          RG="${{ secrets.RESOURCE_GROUP }}"
          PREVIOUS_REVISION="${{ steps.pre-deploy.outputs.revision }}"
          PREVIOUS_IMAGE="${{ steps.pre-deploy.outputs.image }}"
          PREVIOUS_MODE="${{ steps.pre-deploy.outputs.mode }}"

          az_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            while true; do
              if "$@"; then
                return 0
              fi
              local rc=$?

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::warning::az command failed after $attempt attempts: $*" >&2
                return "$rc"
              fi

              echo "az command failed (attempt $attempt/$max_attempts), retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if [ "$delay" -gt 30 ]; then
                delay=30
              fi
            done
          }

          revision_field() {
            python3 -c 'import json, sys; data=json.load(sys.stdin) or {}; print(((data.get("properties") or {}).get(sys.argv[1])) or "")' "$1"
          }

          is_valid_rollback_image() {
            local image="$1"
            case "$image" in
              *.azurecr.io/ellmud-*:*) return 0 ;;
              *) return 1 ;;
            esac
          }

          monitor_active_revision() {
            local label="$1"
            local status=""
            local health=""
            local revision_json

            for i in $(seq 1 72); do
              if ! revision_json=$(az_retry 3 az containerapp revision list \
                --name "$APP" \
                --resource-group "$RG" \
                --query "[?properties.active] | [0]" -o json); then
                echo "$label status unavailable due to transient az error (attempt $i/72); retrying in 10s..."
                sleep 10
                continue
              fi

              status=$(printf '%s' "$revision_json" | revision_field runningState)
              health=$(printf '%s' "$revision_json" | revision_field healthState)

              if { [ "$status" = "Running" ] || [ "$status" = "RunningAtMaxScale" ]; } \
                && { [ "$health" = "Healthy" ] || [ -z "$health" ]; }; then
                echo "✓ $label is running and healthy (state: $status, health: ${health:-unknown})"
                return 0
              fi

              case "$status" in
                Failed|Degraded)
                  echo "✗ $label failed with status: $status, health: ${health:-unknown}"
                  return 1
                  ;;
              esac
              case "$health" in
                Unhealthy|Degraded)
                  echo "$label is not healthy yet (state: ${status:-unknown}, health: $health; attempt $i/72)"
                  ;;
              esac

              echo "$label status: ${status:-unknown}, health: ${health:-unknown} (attempt $i/72)"
              sleep 10
            done

            echo "✗ $label did not reach Running/Healthy state after 12 minutes"
            echo "Last observed status: ${status:-unknown}, health: ${health:-unknown}"
            return 1
          }

          echo "Rolling back to revision: $PREVIOUS_REVISION"
          echo "Previous image: $PREVIOUS_IMAGE"

          if ! is_valid_rollback_image "$PREVIOUS_IMAGE"; then
            echo "::error::Refusing rollback to unsafe image '$PREVIOUS_IMAGE'. Rollback images must be real ACR app images matching *.azurecr.io/ellmud-*:<tag>."
            echo "::error::Leaving the failed deployment state untouched instead of pinning ACA to a bootstrap or non-app image."
            exit 1
          fi

          FAILED_REVISION=$(az_retry 3 az containerapp revision list \
            --name "$APP" \
            --resource-group "$RG" \
            --query "[?properties.active].name | [0]" -o tsv || true)

          # Log failed revision details for debugging.
          if [ -n "$FAILED_REVISION" ]; then
            echo "Failed revision: $FAILED_REVISION"
            FAILED_STATUS=$(az_retry 3 az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$FAILED_REVISION" \
              --query "properties.runningState" -o tsv || echo "unknown")
            echo "Failed revision status: $FAILED_STATUS"

            echo "Container details:"
            az_retry 3 az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$FAILED_REVISION" \
              --query "{command: properties.template.containers[0].command, args: properties.template.containers[0].args, image: properties.template.containers[0].image}" \
              -o json || true
          fi

          REVISION_MODE=$(az_retry 5 az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.configuration.activeRevisionsMode" -o tsv || echo "$PREVIOUS_MODE")
          REVISION_MODE=${REVISION_MODE:-$PREVIOUS_MODE}
          REVISION_MODE=${REVISION_MODE:-Single}
          REVISION_MODE_LOWER=$(printf '%s' "$REVISION_MODE" | tr '[:upper:]' '[:lower:]')
          echo "Active revisions mode: $REVISION_MODE"

          if [ "$REVISION_MODE_LOWER" = "single" ]; then
            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "✗ Cannot roll back single-revision app because previous image was not captured."
              exit 1
            fi

            echo "Single revision mode detected; redeploying previous image without traffic-splitting commands."
            az_retry 5 az containerapp update \
              --name "$APP" \
              --resource-group "$RG" \
              --image "$PREVIOUS_IMAGE" \
              --container-name ellmud \
              --command "node" "packages/server/dist/index.js"
            az_retry 5 az containerapp ingress update \
              --name "$APP" \
              --resource-group "$RG" \
              --target-port 2567
            monitor_active_revision "Rollback revision"
          else
            echo "Multiple revision mode detected; routing traffic back to $PREVIOUS_REVISION."
            az_retry 5 az containerapp ingress traffic set \
              --name "$APP" \
              --resource-group "$RG" \
              --revision-weight "$PREVIOUS_REVISION=100"

            if [ -n "$FAILED_REVISION" ] && [ "$FAILED_REVISION" != "$PREVIOUS_REVISION" ]; then
              if ! az_retry 5 az containerapp revision deactivate \
                --name "$APP" \
                --resource-group "$RG" \
                --revision "$FAILED_REVISION"; then
                echo "::warning::Rollback traffic was restored, but failed to deactivate $FAILED_REVISION."
              fi
            fi
          fi

          echo "✓ Rollback complete"

  # ─── Discord notification after successful UAT deploy ─────────────────────────
  notify-discord-uat:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'uat'
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_SHA }}

      - name: Extract changelog from commits
        id: changelog
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ env.BUILD_SHA }}
        run: |
          NOISE_FILTERS='grep -v "^\• chore(release):" | grep -v "^\• chore:" | grep -v "^\• chore(" | grep -v "^\• \[Scribe\]" | grep -v "^\• squad"'

          filter_noise() {
            grep -v "^\• chore(release):" \
              | grep -v "^\• chore:" \
              | grep -v "^\• chore(" \
              | grep -v "^\• \[Scribe\]" \
              | grep -v "^\• squad"
          }

          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # Push event: use the exact commit range introduced by this push
            CHANGELOG=$(git log --no-merges --format="• %s" "${BEFORE_SHA}..${AFTER_SHA}" \
              | filter_noise \
              | head -20)

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # workflow_dispatch (e.g. triggered by scheduled-uat-promote):
            # HEAD is the merge commit created by the promote; get commits from the
            # second parent (dev tip) that were not already on the first parent (prior uat).
            PARENT2=$(git rev-parse HEAD^2 2>/dev/null || echo "")
            if [ -n "$PARENT2" ]; then
              CHANGELOG=$(git log --no-merges --format="• %s" "HEAD^1..HEAD^2" \
                | filter_noise \
                | head -20)
            else
              # HEAD is not a merge commit; use commits since last tag as fallback
              LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -n "$LAST_TAG" ]; then
                CHANGELOG=$(git log --no-merges --format="• %s" "${LAST_TAG}..HEAD" \
                  | filter_noise \
                  | head -20)
              fi
            fi
          fi

          # If nothing meaningful survived filtering, emit empty content so the
          # Discord notify step is skipped (no stale CHANGELOG.md fallback).
          {
            echo "content<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Announce UAT deploy to Discord
        if: steps.changelog.outputs.content != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_TESTING_ALERTS }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          CHANGELOG_CONTENT: ${{ steps.changelog.outputs.content }}
        run: |
          # Build and send Discord embed payload entirely in Python
          # to safely handle special characters in changelog content
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os

          client_url = os.environ.get("CLIENT_URL", "")
          changelog = os.environ.get("CHANGELOG_CONTENT", "").strip()

          # Clean up changelog: remove leading/trailing blank lines
          lines = changelog.split("\n")
          while lines and not lines[0].strip():
              lines.pop(0)
          while lines and not lines[-1].strip():
              lines.pop()
          clean_changelog = "\n".join(lines)

          description = (
              "🧪 **New build on the test server!**\n\n"
              "Here's what changed:\n\n"
              f"{clean_changelog}\n\n"
              f"🔗 **[Jump into the test server]({client_url})**"
          )

          payload = {
              "embeds": [{
                  "title": "🚀 New UAT Build Deployed",
                  "description": description,
                  "color": 5763719,
                  "footer": {
                      "text": "ellmud test server"
                  }
              }]
          }
          print(json.dumps(payload))
          PYEOF
          )

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

  # ─── Create issue on CI failure ───────────────────────────────────────────────
  create-failure-issue:
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.build-and-test.result == 'failure' || needs.docker-build-push.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [build-and-test, docker-build-push, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail

          EFFECTIVE_SHA="${BUILD_SHA:-$GITHUB_SHA}"
          SHORT_SHA="${EFFECTIVE_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="CI/CD failure on ${BRANCH} (${SHORT_SHA})"

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_issue" ]; then
            echo "Issue #$existing_issue already exists for ${SHORT_SHA}."
            exit 0
          fi

          body_file="$(mktemp)"
          cat <<EOF > "$body_file"
          CI/CD failure detected on \`${BRANCH}\`.

          - Workflow run: ${RUN_URL}
          - Commit: ${EFFECTIVE_SHA}
          - Commit message: ${COMMIT_MESSAGE}
          - Commit author: ${COMMIT_AUTHOR}
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
