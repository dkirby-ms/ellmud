<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0C8D8"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A04A"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0A0B0F"/>
  <!-- Blade -->
  <path d="M16 3 L18.5 20 L16 22 L13.5 20 Z" fill="url(#blade)" opacity="0.95"/>
  <!-- Crossguard -->
  <rect x="10" y="20" width="12" height="2.5" rx="1" fill="url(#glow)"/>
  <!-- Grip -->
  <rect x="14.5" y="22.5" width="3" height="4" rx="0.5" fill="#5C3D1A"/>
  <!-- Pommel -->
  <circle cx="16" cy="28" r="1.8" fill="url(#glow)"/>
  <!-- Blade edge highlight -->
  <path d="M16 4.5 L16 19.5" stroke="#E8E0D0" stroke-width="0.5" opacity="0.4"/>
</svg>
